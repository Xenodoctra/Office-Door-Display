<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FF Chambers Office Door Display</title>
<style>
:root{--bg:#0f172a;--panel:#1e293b;--panel2:#334155;--card:#111827;--text:#fff;--muted:#cbd5e1;--accent:#38bdf8;--available:#22c55e;--out:#f97316;--lunch:#eab308;--meeting:#a855f7;--day:#ef4444;--training:#3b82f6;--unavailable:#94a3b8;--vacation:#67e8f9;--offsite:#f97316}
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text)}body{display:flex;align-items:center;justify-content:center;padding:16px}.display{width:100%;max-width:1250px;min-height:94vh;background:var(--panel);border-radius:28px;padding:28px;box-shadow:0 24px 60px rgba(0,0,0,.45);display:grid;grid-template-rows:auto auto 1fr auto auto;gap:18px;position:relative}.top{display:grid;grid-template-columns:auto 1.4fr 1fr;gap:18px;align-items:center;border-bottom:3px solid var(--panel2);padding-bottom:18px}.logo-wrap{width:92px;height:92px;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:50%}.logo-wrap img{width:100%;height:100%;object-fit:contain}.name{font-size:clamp(2.1rem,4.8vw,4.3rem);line-height:1;font-weight:900;letter-spacing:-1px}.role{margin-top:8px;font-size:clamp(1.15rem,2vw,1.9rem);color:var(--muted);font-weight:700}.right-top{text-align:right;font-size:clamp(1.05rem,1.8vw,1.55rem);line-height:1.4}.date{color:var(--accent);font-weight:800}.phone{margin-top:8px;font-size:clamp(1.7rem,3.2vw,2.9rem);font-weight:900}.status-wrap{display:grid;grid-template-columns:1fr auto;gap:14px;align-items:stretch}.status-area{display:grid;gap:8px}.status{border-radius:24px;padding:20px 26px;text-align:center;font-size:clamp(2.1rem,4.5vw,4.5rem);line-height:1;font-weight:950;text-transform:uppercase;letter-spacing:2px;border:4px solid rgba(255,255,255,.25)}.status-sub{text-align:center;color:var(--muted);font-size:clamp(1rem,1.6vw,1.35rem);font-weight:800;min-height:1.4em}.available{background:#052e16;border-color:var(--available)}.out{background:#431407;border-color:var(--out)}.lunch{background:#422006;border-color:var(--lunch)}.meeting{background:#2e1065;border-color:var(--meeting)}.day{background:#450a0a;border-color:var(--day)}.training{background:#172554;border-color:var(--training)}.unavailable{background:#334155;border-color:var(--unavailable)}.vacation{background:#164e63;border-color:var(--vacation)}.offsite{background:#78350f;border-color:var(--offsite)}.chief{background:#f8fafc;border-color:#fff;color:#020617}.custom{background:#082f49;border-color:var(--accent)}.qr-card{width:135px;background:var(--card);border-radius:20px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}.qr-card img{width:108px;height:108px;background:#fff;padding:5px;border-radius:10px}.qr-label{text-align:center;font-size:.72rem;color:var(--muted);font-weight:800;text-transform:uppercase;letter-spacing:.6px}.main{display:grid;grid-template-columns:.9fr 1.35fr;gap:18px;min-height:0}.card{background:var(--card);border-radius:22px;padding:22px;overflow:hidden}.card-title{text-transform:uppercase;letter-spacing:1.3px;color:var(--muted);font-size:clamp(.9rem,1.3vw,1.15rem);margin-bottom:14px;font-weight:800}.quote{font-size:clamp(1.35rem,2.1vw,2.05rem);line-height:1.28;font-style:italic}.quote-author{margin-top:14px;font-size:clamp(.95rem,1.4vw,1.2rem);color:var(--muted)}.training-note{margin-top:20px;padding-top:16px;border-top:2px solid #334155;font-size:clamp(1.05rem,1.5vw,1.4rem);line-height:1.35;font-weight:700}.schedule{display:grid;gap:5px;font-size:clamp(1.15rem,1.8vw,1.85rem);line-height:1.25;font-weight:700}.schedule-row{display:block;padding:7px 10px;border-radius:8px}.schedule-row.past{opacity:.38}.schedule-row.current{color:#fff;background:rgba(56,189,248,.18);border-left:8px solid var(--accent);opacity:1}.message{background:var(--panel2);border-radius:18px;padding:15px 20px;font-size:clamp(1.2rem,1.8vw,1.7rem);text-align:center;font-weight:800}.message.urgent{background:#7f1d1d;border:4px solid #ef4444;animation:pulseUrgent 1.5s infinite}@keyframes pulseUrgent{0%{opacity:1}50%{opacity:.65}100%{opacity:1}}.bottom-row{display:flex;justify-content:space-between;align-items:center;gap:12px}.sync-note{color:#64748b;font-size:.8rem;text-align:right}.local-override-note{color:#facc15;font-size:.8rem;font-weight:800;display:none}.error-note{color:#fecaca;background:#7f1d1d;padding:9px 12px;border-radius:10px;font-weight:800;display:none}.quick-button{position:fixed;right:14px;bottom:12px;z-index:20;border:none;border-radius:12px;padding:11px 14px;background:#0f172a;color:#cbd5e1;font-weight:800;opacity:.45}.quick-button:hover,.quick-button:focus{opacity:1}.quick-panel{position:fixed;right:14px;bottom:62px;z-index:25;width:min(360px,calc(100vw - 28px));background:#020617;border:2px solid #475569;border-radius:18px;padding:14px;box-shadow:0 20px 50px rgba(0,0,0,.55);display:none}.quick-panel.open{display:block}.quick-panel-title{font-weight:900;margin-bottom:10px;color:#fff}.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.quick-grid button{border:none;border-radius:10px;padding:12px 10px;font-weight:900;font-size:1rem}.q-offsite{background:#78350f;color:#fff}.q-chief{background:#fff;color:#020617}.q-lunch{background:#422006;color:#fff}.q-dnd{background:#450a0a;color:#fff}.q-out{background:#7f1d1d;color:#fff}.q-return{background:#14532d;color:#fff;grid-column:1/-1}@media(max-width:800px){body{padding:8px}.display{border-radius:18px;padding:18px;min-height:97vh}.top{grid-template-columns:auto 1fr}.right-top{grid-column:1/-1;text-align:left;display:flex;justify-content:space-between;align-items:center}.status-wrap{grid-template-columns:1fr}.qr-card{display:none}.main{grid-template-columns:1fr 1.25fr}.logo-wrap{width:70px;height:70px}}
</style>
</head>
<body>
<main class="display">
<section class="top"><div class="logo-wrap"><img src="cfd-logo.jpg" alt="Columbus Division of Fire" onerror="this.parentElement.style.display='none'"></div><div><div class="name">FF Chambers</div><div class="role">Fire Chief’s Liaison</div></div><div class="right-top"><div class="date" id="date"></div><div class="phone">614-374-4774</div></div></section>
<section class="status-wrap"><div class="status-area"><div class="status available" id="statusBox">Available</div><div class="status-sub" id="statusSub"></div></div><div class="qr-card"><img src="contact-qr.png" alt="Scan to contact FF Chambers"><div class="qr-label">Scan to contact</div></div></section>
<section class="main"><div class="card"><div class="card-title">Quote of the Day</div><div class="quote" id="quoteText">Loading quote...</div><div class="quote-author" id="quoteAuthor"></div><div class="training-note" id="trainingNote">Training note loading...</div></div><div class="card"><div class="card-title">Today’s Schedule</div><div class="schedule" id="schedule"></div></div></section>
<section class="message" id="message">Loading door message...</section><div class="error-note" id="errorNote"></div><div class="bottom-row"><div class="local-override-note" id="localOverrideNote">LOCAL QUICK STATUS ACTIVE</div><div class="sync-note" id="syncNote">Checking data.json...</div></div>
</main>
<button class="quick-button" onclick="toggleQuickPanel()">Quick Status</button>
<section class="quick-panel" id="quickPanel"><div class="quick-panel-title">Quick Status</div><div class="quick-grid"><button class="q-offsite" onclick="setQuickOverride('offsite','Offsite. Please call or text if needed.')">Offsite</button><button class="q-chief" onclick="setQuickOverride('chief','Meeting with the Fire Chief. Please call or text if needed.')">With Chief</button><button class="q-lunch" onclick="setQuickOverride('lunch','At lunch. Please call or text if needed.')">Lunch</button><button class="q-dnd" onclick="setQuickOverride('dnd','Do not disturb unless immediate assistance is needed.')">Do Not Disturb</button><button class="q-out" onclick="setQuickOverride('day','Out for the day. Please call or text if needed.')">Out for Day</button><button class="q-return" onclick="clearQuickOverride()">Return to Schedule</button></div></section>
<script>
const defaultData={displayDate:'',message:'Text or call if needed.',urgent:false,trainingNote:'Training note: Be clear, calm, and brief on the radio.',staleAfter:'10:00',staleStatus:'outOfOfficeForDay',staleMessage:'Out of the office for the day. Please call or text if immediate assistance is needed.',staleSchedule:'07:00 - 15:00  Out of Office',quote:null,override:{enabled:false,status:'',message:''},scheduleItems:[{start:'07:00',end:'09:00',status:'available',label:'Available'},{start:'09:00',end:'10:00',status:'meeting',label:'Meeting'},{start:'10:00',end:'12:00',status:'available',label:'Available'},{start:'12:00',end:'13:00',status:'lunch',label:'Lunch'},{start:'13:00',end:'15:00',status:'chief',label:'Meeting with Fire Chief'},{start:'15:00',end:'23:59',status:'day',label:'Out for Day'}]};
const knownStatuses={available:{label:'Available',className:'available'},vacation:{label:'Vacation',className:'vacation'},out:{label:'Out',className:'out'},outofofficeforday:{label:'Out of Office for Day',className:'day'},offsite:{label:'Offsite',className:'offsite'},lunch:{label:'Lunch',className:'lunch'},meeting:{label:'Meeting',className:'meeting'},day:{label:'Out for Day',className:'day'},outforday:{label:'Out for Day',className:'day'},training:{label:'Training',className:'training'},unavailable:{label:'Unavailable',className:'unavailable'},donotdisturb:{label:'Do Not Disturb',className:'day'},dnd:{label:'Do Not Disturb',className:'day'},chief:{label:'Meeting with Fire Chief',className:'chief'},meetingwithfirechief:{label:'Meeting with Fire Chief',className:'chief'},workout:{label:'Working Out',className:'training'},workingout:{label:'Working Out',className:'training'}};
const backupQuotes=[{text:'Do the next right thing.',author:'Unknown'},{text:'The obstacle is the way.',author:'Marcus Aurelius'},{text:'Waste no more time arguing what a good person should be. Be one.',author:'Marcus Aurelius'},{text:'You have power over your mind — not outside events. Realize this, and you will find strength.',author:'Marcus Aurelius'},{text:'Be useful. Be honest. Be kind.',author:'Unknown'},{text:'Small acts, done consistently, become identity.',author:'Unknown'},{text:'Discipline is choosing what you want most over what you want now.',author:'Unknown'}];
let currentData=JSON.parse(JSON.stringify(defaultData));
function setDate(){const now=new Date();document.getElementById('date').textContent=now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'})}
function timeToMinutes(t){const p=String(t||'').trim().split(':');if(p.length!==2)return null;const h=Number(p[0]),m=Number(p[1]);if(Number.isNaN(h)||Number.isNaN(m))return null;return h*60+m}
function minutesToDisplay(v){if(v==null)return'';let h=Math.floor(v/60);const m=v%60,s=h>=12?'PM':'AM';h=h%12||12;return `${h}:${String(m).padStart(2,'0')} ${s}`}
function nowInMinutes(){const n=new Date();return n.getHours()*60+n.getMinutes()}
function todayKey(){const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`}
function isWeekend(){const d=new Date().getDay();return d===0||d===6}
function isDataStale(d){if(!d.displayDate||isWeekend())return false;const s=timeToMinutes(d.staleAfter||'10:00');return s!==null&&d.displayDate!==todayKey()&&nowInMinutes()>=s}
function normalizeStatus(v){return String(v||'available').trim().toLowerCase().replaceAll(' ','').replaceAll('-','')}
function applyStatus(v){const e=document.getElementById('statusBox'),k=knownStatuses[normalizeStatus(v)];if(k){e.className='status '+k.className;e.textContent=k.label}else{e.className='status custom';e.textContent=String(v||'Available').trim()}}
function findCurrentScheduleItem(a){const n=nowInMinutes();if(!Array.isArray(a))return null;return a.find(i=>{const s=timeToMinutes(i.start),e=timeToMinutes(i.end);return s!==null&&e!==null&&n>=s&&n<e})||null}
function findNextAvailable(a,c){if(!Array.isArray(a)||!c)return null;const x=a.findIndex(i=>i.start===c.start&&i.end===c.end&&i.status===c.status);if(x<0)return null;for(let i=x+1;i<a.length;i++)if(normalizeStatus(a[i].status)==='available')return timeToMinutes(a[i].start);return null}
function buildStatusSub(a,c,e,s,l,j){if(l)return'Quick status override — tap Return to Schedule when back';if(j)return'Manual override active';if(s)return'Schedule has not been updated today';if(!c)return'';const st=normalizeStatus(e),end=timeToMinutes(c.end);if(st==='available')return end!==null?`Available until ${minutesToDisplay(end)}`:'';const next=findNextAvailable(a,c);return next!==null?`Available at ${minutesToDisplay(next)}`:'Out for the rest of the day'}
function escapeHtml(t){return String(t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}
function buildScheduleHtml(a,c){if(!Array.isArray(a))return'';const n=nowInMinutes();return a.map(i=>{const end=timeToMinutes(i.end),label=i.label||i.status||'',line=`${i.start} - ${i.end}  ${label}`;let state='future';if(c&&i.start===c.start&&i.end===c.end&&label===(c.label||c.status||''))state='current';else if(end!==null&&end<=n)state='past';return `<span class="schedule-row ${state}">${escapeHtml(line)}</span>`}).join('')}
function setQuoteFromData(d){if(d.quote&&d.quote.text){document.getElementById('quoteText').textContent='“'+d.quote.text+'”';let b='— '+(d.quote.author||'Unknown');if(d.quote.source)b+=' · '+d.quote.source;document.getElementById('quoteAuthor').textContent=b;return}const n=new Date(),s=new Date(n.getFullYear(),0,0),dy=Math.floor((n-s)/(1000*60*60*24)),q=backupQuotes[dy%backupQuotes.length];document.getElementById('quoteText').textContent='“'+q.text+'”';document.getElementById('quoteAuthor').textContent='— '+q.author}
function getQuickOverride(){try{const r=localStorage.getItem('doorQuickOverride');if(!r)return{enabled:false,status:'',message:''};const p=JSON.parse(r);return{enabled:p.enabled===true,status:p.status||'',message:p.message||''}}catch{return{enabled:false,status:'',message:''}}}
function setQuickOverride(status,message){localStorage.setItem('doorQuickOverride',JSON.stringify({enabled:true,status,message}));document.getElementById('quickPanel').classList.remove('open');applyData(currentData)}
function clearQuickOverride(){localStorage.removeItem('doorQuickOverride');document.getElementById('quickPanel').classList.remove('open');applyData(currentData)}
function toggleQuickPanel(){document.getElementById('quickPanel').classList.toggle('open')}
function applyData(data){const m={...defaultData,...data,override:{...defaultData.override,...(data.override||{})}};currentData=m;const c=findCurrentScheduleItem(m.scheduleItems),j=m.override&&m.override.enabled===true,s=isDataStale(m),q=getQuickOverride(),l=q.enabled===true;let e='out';if(l)e=q.status||'unavailable';else if(j)e=m.override.status||'unavailable';else if(s)e=m.staleStatus||'outOfOfficeForDay';else if(c)e=c.status||c.label||'unavailable';applyStatus(e);document.getElementById('statusSub').textContent=buildStatusSub(m.scheduleItems,c,e,s,l,j);if(s&&!j&&!l)document.getElementById('schedule').innerHTML=`<span class="schedule-row current">${escapeHtml(m.staleSchedule||'07:00 - 15:00  Out of Office')}</span>`;else document.getElementById('schedule').innerHTML=buildScheduleHtml(m.scheduleItems,c);let msg=m.message||defaultData.message;if(s&&m.staleMessage)msg=m.staleMessage;if(j&&m.override.message)msg=m.override.message;if(l&&q.message)msg=q.message;const box=document.getElementById('message');box.textContent=msg;box.classList.toggle('urgent',m.urgent===true);document.getElementById('trainingNote').textContent=m.trainingNote||defaultData.trainingNote;document.getElementById('localOverrideNote').style.display=l?'block':'none';setQuoteFromData(m)}
async function loadDoorData(){try{const r=await fetch('data.json?cacheBust='+Date.now());if(!r.ok)throw new Error('Could not load data.json');const d=await r.json();document.getElementById('errorNote').style.display='none';applyData(d);const t=new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});document.getElementById('syncNote').textContent=d.lastUpdated?`Schedule updated ${d.lastUpdated} · checked ${t}`:`Checked data.json at ${t}`}catch(e){document.getElementById('errorNote').style.display='block';document.getElementById('errorNote').textContent='Could not read data.json. Check commas, quotes, and brackets.';applyData(currentData||defaultData);document.getElementById('syncNote').textContent='Using last good data.'}}
setDate();applyData(defaultData);loadDoorData();setInterval(setDate,60*1000);setInterval(loadDoorData,30*1000);setInterval(()=>applyData(currentData),60*1000);setInterval(()=>location.reload(),4*60*60*1000);
</script>
</body>
</html>
